<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Fonts bundled with the Lambda package live here. -->
  <dir>/var/task/functions/social/fonts</dir>
  <cachedir>/tmp/fonts-cache</cachedir>
  <!-- Fall back to Oswald (our brand font) for any unmatched family. -->
  <match target="pattern">
    <test name="family"><string>Gooners</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Oswald</string></edit>
  </match>
</fontconfig>
