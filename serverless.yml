service: arsenal-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    FOOTBALL_API_KEY: ${env:FOOTBALL_API_KEY, ssm:/tgw/football-api-key}
    NEWS_API_KEY: ${env:NEWS_API_KEY, ssm:/tgw/news-api-key}
    ALLOWED_ORIGINS: ${self:custom.allowedOrigins.${self:provider.stage}}
    ADMIN_KEY: ${env:ADMIN_KEY, ssm:/tgw/admin-key}
    ADMIN_PASSWORD: ${env:ADMIN_PASSWORD, ssm:/tgw/admin-password}
    IG_ACCESS_TOKEN: ${env:IG_ACCESS_TOKEN, ssm:/tgw/ig-access-token}
    IG_ACCOUNT_ID: ${env:IG_ACCOUNT_ID, ssm:/tgw/ig-account-id}
    X_APP_KEY: ${env:X_APP_KEY, ssm:/tgw/x-app-key}
    X_APP_SECRET: ${env:X_APP_SECRET, ssm:/tgw/x-app-secret}
    X_ACCESS_TOKEN: ${env:X_ACCESS_TOKEN, ssm:/tgw/x-access-token}
    X_ACCESS_TOKEN_SECRET: ${env:X_ACCESS_TOKEN_SECRET, ssm:/tgw/x-access-token-secret}
    S3_IMAGES_BUCKET: ${env:S3_IMAGES_BUCKET, 'tgw-social-images'}
    SOCIAL_DRAFTS_TABLE: tgw-social-drafts-${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - "arn:aws:bedrock:*::foundation-model/*"
            - "arn:aws:bedrock:*:*:inference-profile/*"
        - Effect: Allow
          Action:
            - bedrock:InvokeAgent
          Resource:
            - "arn:aws:bedrock:us-east-1:*:agent/*"
            - "arn:aws:bedrock:us-east-1:*:agent-alias/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - "arn:aws:s3:::tgw-social-images/*"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - "arn:aws:dynamodb:us-east-1:*:table/tgw-social-drafts-${self:provider.stage}"
            - "arn:aws:dynamodb:us-east-1:*:table/tgw-social-drafts-${self:provider.stage}/index/*"
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:PutParameter
          Resource:
            - "arn:aws:ssm:us-east-1:*:parameter/tgw/*"
  apiGateway:
    apiKeys:
      - tgw-frontend-${self:provider.stage}
      - footbball-app-${self:provider.stage}
    usagePlan:
      quota:
        limit: 1000
        period: DAY
      throttle:
        burstLimit: 15
        rateLimit: 10

custom:
  allowedOrigins:
    dev: "https://the-gooners-world.web.app,https://the-footbball-app.web.app"
    prod: "https://the-gooners-world.web.app,https://the-footbball-app.web.app"

functions:
  footballProxy:
    handler: functions/proxy/footballProxy.handler
    events:
      - http:
          path: proxy/football
          method: get
          cors: true
          private: true

  newsProxy:
    handler: functions/proxy/newsProxy.handler
    timeout: 15
    events:
      - http:
          path: proxy/news
          method: get
          cors: true
          private: true

  aiProxy:
    handler: functions/proxy/aiProxy.handler
    timeout: 15
    events:
      - http:
          path: proxy/ai
          method: get
          cors: true
          private: true

  agentHandler:
    handler: functions/agent/agentHandler.handler
    timeout: 29
    description: Bedrock Agent Core action group handler — Arsenal FC data tools

  agentChat:
    handler: functions/agent/agentChat.handler
    timeout: 30
    environment:
      BEDROCK_AGENT_ID: ${env:BEDROCK_AGENT_ID, 'PLACEHOLDER'}
      BEDROCK_AGENT_ALIAS_ID: ${env:BEDROCK_AGENT_ALIAS_ID, 'PLACEHOLDER'}
    events:
      - http:
          path: agent/chat
          method: post
          cors: true
          private: true

  adminAuth:
    handler: functions/admin/adminAuth.handler
    timeout: 10
    events:
      - http:
          path: admin/auth
          method: post
          cors: true
          private: true
      - http:
          path: admin/auth
          method: options
          cors: true

  generateMatchPost:
    handler: functions/admin/generateMatchPost.handler
    timeout: 20
    events:
      - http:
          path: admin/generate
          method: post
          cors: true
          private: true
      - http:
          path: admin/generate
          method: options
          cors: true

  publishPost:
    handler: functions/admin/publishPost.handler
    timeout: 30
    events:
      - http:
          path: admin/publish
          method: post
          cors: true
          private: true
      - http:
          path: admin/publish
          method: options
          cors: true

  socialOrchestrator:
    handler: functions/social/orchestrator.handler
    timeout: 120
    memorySize: 1024
    environment:
      FONTCONFIG_FILE: /var/task/functions/social/fonts/fonts.conf
    description: Autopilot — detects pre-match / full-time and generates post drafts
    events:
      - schedule: rate(1 hour)

  socialDrafts:
    handler: functions/social/drafts.handler
    timeout: 60
    memorySize: 1024
    environment:
      FONTCONFIG_FILE: /var/task/functions/social/fonts/fonts.conf
    description: Admin drafts API — list / approve (publish) / reject / edit
    events:
      - http:
          path: admin/drafts
          method: get
          cors: true
          private: true
      - http:
          path: admin/drafts
          method: post
          cors: true
          private: true
      - http:
          path: admin/drafts
          method: options
          cors: true

  quickDraft:
    handler: functions/social/quickDraft.handler
    timeout: 60
    memorySize: 1024
    environment:
      FONTCONFIG_FILE: /var/task/functions/social/fonts/fonts.conf
    description: Quick Draft composer — generic templated posts (signing/injury/etc.)
    events:
      - http:
          path: admin/quick-draft
          method: post
          cors: true
          private: true
      - http:
          path: admin/quick-draft
          method: options
          cors: true

  refreshIgToken:
    handler: functions/social/refreshIgToken.handler
    timeout: 30
    description: Keeps the Instagram long-lived token alive (weekly)
    events:
      - schedule: rate(7 days)

  mcpHttp:
    handler: functions/mcp/mcpHttp.handler
    timeout: 29
    description: Remote MCP server (Streamable HTTP, stateless) — Arsenal tools over the shared tool layer
    events:
      # Authenticated route (x-api-key) — for real/keyed clients.
      - http:
          path: mcp
          method: post
          cors: true
          private: true
      - http:
          path: mcp
          method: options
          cors: true
      # Public demo route — no key, so Claude's custom-connector UI connects by
      # URL alone. Safe here: this path has NO Bedrock cost (the LLM runs in the
      # client), the handler caches upstream calls, and the account-level API
      # Gateway throttle (10 req/s, 15 burst) still applies. Only exposes the
      # football-data.org quota, which is cached.
      - http:
          path: mcp-public
          method: post
          cors: true
      - http:
          path: mcp-public
          method: options
          cors: true

resources:
  Resources:
    SocialDraftsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: tgw-social-drafts-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: draftId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: draftId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: statusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

plugins:
  - serverless-offline
